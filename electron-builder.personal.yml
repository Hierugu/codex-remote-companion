appId: com.wake0ne.codex-remote-companion.alex
productName: Codex Remote Companion Alex
artifactName: Codex-Remote-Companion-Alex-${version}-${arch}.${ext}
asar: true

directories:
  buildResources: build
  output: release/alex

files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  artifactName: Codex-Remote-Companion-Alex-${version}-${arch}.${ext}
